name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: db_aplikasi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Environment files must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Require dependency lock files
        shell: bash
        run: |
          if [ -f composer.json ] && [ ! -f composer.lock ]; then
            echo "composer.lock is required when composer.json exists."
            exit 1
          fi
          if [ -f package.json ] && [ ! -f package-lock.json ] && [ ! -f pnpm-lock.yaml ] && [ ! -f yarn.lock ]; then
            echo "A JavaScript dependency lock file is required."
            exit 1
          fi

      - name: PHP syntax check
        shell: bash
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Application tests
        shell: bash
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: db_aplikasi
          DB_USERNAME: root
          DB_PASSWORD: ci-root-password
          SIMIT_ADMIN_NAME: CI Admin
          SIMIT_ADMIN_EMAIL: admin-ci@simit.local
          SIMIT_ADMIN_PASSWORD: CI-Only!Strong123
        run: |
          php bin/migrate.php
          php bin/create-admin.php
          php tests/smoke.php
          php tests/workflow.php
          php tests/communication.php
          php tests/security.php
          php tests/policy.php
